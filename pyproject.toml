[project]
name = "dinebridge-api"
version = "0.1.0"
description = "Tenant-aware restaurant ordering API"
requires-python = ">=3.13,<3.15"
dependencies = [
  "Django>=5.2.18,<5.3",
  "djangorestframework>=3.16.1,<3.17",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "dj-database-url>=2.3,<4",
  "django-cors-headers>=4.9,<5",
  "gunicorn>=23,<25",
  "uvicorn>=0.35,<1",
  "uvicorn-worker>=0.4,<1",
  "pillow>=11,<13",
  "pillow-heif>=1.8,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.10,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dinebridge.settings"
python_files = ["test_*.py"]
